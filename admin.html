<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo | Corte10</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f0f0f;
color:#fff;
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:#151515;
padding:30px 20px;
border-right:1px solid #222;
}

.logo{
font-size:28px;
font-weight:800;
margin-bottom:40px;
color:#d4af37;
}

.menu{
display:flex;
flex-direction:column;
gap:12px;
}

.menu button{
background:#1f1f1f;
border:none;
color:#fff;
padding:15px;
border-radius:12px;
cursor:pointer;
text-align:left;
transition:.3s;
}

.menu button:hover{
background:#d4af37;
color:#000;
}

.main{
flex:1;
padding:30px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#181818;
padding:25px;
border-radius:18px;
border:1px solid #262626;
}

.card h3{
color:#aaa;
font-size:14px;
margin-bottom:10px;
}

.card span{
font-size:32px;
font-weight:700;
color:#d4af37;
}

.section{
background:#181818;
padding:25px;
border-radius:20px;
margin-bottom:25px;
}

.section h2{
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

table th,
table td{
padding:14px;
text-align:left;
border-bottom:1px solid #2d2d2d;
}

.badge{
padding:8px 12px;
border-radius:20px;
font-size:12px;
font-weight:600;
}

.confirmado{
background:#123a1b;
color:#4cff88;
}

.pendente{
background:#4d4208;
color:#ffd93d;
}

.cancelado{
background:#3a1212;
color:#ff6b6b;
}

.btn{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
margin-right:5px;
}

.btn-green{
background:#25d366;
color:white;
}

.btn-red{
background:#ff4d4d;
color:white;
}

.btn-gold{
background:#d4af37;
color:black;
}

input,
select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#101010;
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

@media(max-width:900px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
border-right:none;
border-bottom:1px solid #222;
}

}

</style>
</head>

<body>

<aside class="sidebar">

<div class="logo">
✂️ CORTE10
</div>

<div class="menu">

<button>📅 Agenda</button>

<button>👥 Clientes</button>

<button>✂️ Serviços</button>

<button>⚙️ Configurações</button>

<button>🚪 Sair</button>

</div>

</aside>

<main class="main">

<div class="topbar">

<h1>Painel Administrativo</h1>

<button class="btn btn-gold">
+ Novo Horário
</button>

</div>

<div class="cards">

<div class="card">
<h3>Agendamentos Hoje</h3>
<span>12</span>
</div>

<div class="card">
<h3>Confirmados</h3>
<span>8</span>
</div>

<div class="card">
<h3>Pendentes</h3>
<span>3</span>
</div>

<div class="card">
<h3>Bloqueados</h3>
<span>1</span>
</div>

</div>

<div class="section">

<h2>Agendamentos</h2>

<table>

<thead>
<tr>
<th>Horário</th>
<th>Cliente</th>
<th>Serviço</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>

<tbody>

<tr>
<td>08:00</td>
<td>João</td>
<td>Corte Social</td>
<td>
<span class="badge confirmado">
Confirmado
</span>
</td>
<td>
<button class="btn btn-red">
Cancelar
</button>
</td>
</tr>

<tr>
<td>10:00</td>
<td>Pedro</td>
<td>Degradê</td>
<td>
<span class="badge pendente">
Pendente
</span>
</td>
<td>
<button class="btn btn-green">
Confirmar
</button>

<button class="btn btn-red">
Cancelar
</button>
</td>
</tr>

</tbody>

</table>

</div>

<div class="section">

<h2>Gerenciar Serviços</h2>

<div class="grid">

<div>

<label>Nome do Serviço</label>
<input type="text" placeholder="Ex: Corte Social">

<label>Preço</label>
<input type="number" placeholder="10">

<label>Duração (minutos)</label>
<input type="number" placeholder="30">

<button class="btn btn-gold">
Salvar Serviço
</button>

</div>

</div>

</div>

<div class="section">

<h2>Configurações</h2>

<div class="grid">

<div>

<label>Nome do Negócio</label>
<input value="Corte10">

<label>WhatsApp</label>
<input value="75997142719">

<label>Abertura</label>
<input type="time" value="08:00">

<label>Fechamento</label>
<input type="time" value="18:00">

<button class="btn btn-gold">
Salvar Configurações
</button>

</div>

</div>

</div>

</main>

</body>

</html>
