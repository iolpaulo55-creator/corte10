<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corte10 | Agendamento</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:Poppins;background:#0f0f0f;color:#fff}
.hero{text-align:center;padding:60px;background:#111}
.hero h1{color:#d4af37;font-size:3rem}
.container{max-width:1000px;margin:auto;padding:20px}
.card{background:#181818;padding:15px;border-radius:12px;margin:10px 0}
.whats{position:fixed;bottom:20px;right:20px;background:#25d366;padding:15px;border-radius:50px;color:#fff;text-decoration:none}
</style>
</head>

<body>

<div class="hero">
<h1>CORTE10</h1>
<p>Cortes a partir de R$10</p>
</div>

<div class="container">

<h2>Serviços</h2>
<div id="servicos">Carregando...</div>

</div>

<a class="whats" href="https://wa.me/5575997142719">WhatsApp</a>

<script>
const SUPABASE_URL = "https://scugbsbfxwtfepislpvy.supabase.co";
const SUPABASE_KEY = "sb_publishable_3DRRKcPZj82x65GzTlVrOg_18W-8Zbw";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadServices(){
const { data } = await supabase.from("servicos").select("*");

const box = document.getElementById("servicos");
box.innerHTML = "";

if(!data){
box.innerHTML = "Erro ao carregar";
return;
}

data.forEach(s=>{
box.innerHTML += `
<div class="card">
<b>${s.nome}</b><br>
R$ ${s.preco}
</div>`;
});
}

loadServices();
</script>

</body>
</html>
